server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 健康检查端点（容器 HEALTHCHECK 与编排探针共用）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    # 指纹化静态资源可长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # 纯前端单页应用：未知路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
