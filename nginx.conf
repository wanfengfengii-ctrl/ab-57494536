server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 健康检查端点
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 单页应用回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资产缓存
    location ~* \.(?:js|css|svg|png|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
