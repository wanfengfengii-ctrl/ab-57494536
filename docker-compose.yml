services:
  # 静态 Web 服务：宿主机端口通过环境变量 WEB_PORT 配置（默认 8080）
  web:
    build:
      context: .
      target: web
    image: ring-wiring-web:latest
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  # 一次性校验：完成构建、代码测试及 HTTP 冒烟后自行退出，以退出码报告结果
  # 用法： docker compose build && docker compose run --rm verify
  verify:
    build:
      context: .
      target: builder
    image: ring-wiring-builder:latest
    command: ["sh", "/app/verify.sh"]
    depends_on:
      web:
        condition: service_healthy
    restart: "no"
